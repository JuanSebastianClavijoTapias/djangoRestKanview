{% extends "kanview/crud_base.html" %}
{% block title %}Kanview - Cambiar contraseña{% endblock %}
{% block content %}
<div class="max-w-xl">
<h2 class="text-2xl font-bold mb-6">Cambiar contraseña</h2>
<form class="bg-white rounded-2xl shadow-neomorphic-lift p-8 flex flex-col gap-4" method="post">
{% csrf_token %}
<label class="text-sm font-medium text-gray-700" for="id_actual">Contraseña actual</label>
<input class="rounded-xl border px-4 py-3" id="id_actual" name="actual" type="password" required/>
<label class="text-sm font-medium text-gray-700" for="id_nueva">Nueva contraseña</label>
<input class="rounded-xl border px-4 py-3" id="id_nueva" minlength="8" name="nueva" type="password" required/>
<label class="text-sm font-medium text-gray-700" for="id_repetida">Repetir nueva contraseña</label>
<input class="rounded-xl border px-4 py-3" id="id_repetida" minlength="8" name="repetida" type="password" required/>
<div class="flex gap-3 mt-2">
<button class="bg-[#006565] text-white px-6 py-2.5 rounded-xl text-sm font-semibold" type="submit">Actualizar</button>
<a class="px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-100" href="{% url 'kanview:perfil' %}">Cancelar</a>
</div>
</form>
</div>
{% endblock %}
