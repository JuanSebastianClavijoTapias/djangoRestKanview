<!-- Sidebar compartido. Requiere "nav_items" (4-tuplas (icono, etiqueta, nombre_url, seccion)
     ya filtradas por rol) y "active" (etiqueta activa) en el contexto.
     En móvil está oculto (hidden) y aparece a partir de `lg`: el contenido se
     escala con `lg:ml-64`, no se rediseña.
     El botón hamburguesa del header (kanview/_header.html) le añade la clase
     «abierto» para mostrarlo como panel deslizante; el fondo oscuro
     (#sidebar-fondo) cierra el menú con un clic. -->
{% load static %}
<aside aria-label="Menú principal" class="hidden lg:flex w-64 h-screen fixed left-0 top-0 bg-[#006565] z-50 flex-col py-6 px-4" id="sidebar">
    <div class="flex items-center gap-3 px-4 py-2 mb-8">
        <div class="w-12 h-12 rounded-xl overflow-hidden shrink-0 bg-white flex items-center justify-center p-1">
            <img alt="Logo de Kanview" class="w-full h-full object-contain" src="{% static 'kanview/img/logo-kanview-icono.png' %}"/>
        </div>
        <div class="flex flex-col">
            <span class="text-xl font-bold text-white tracking-tight">Kanview</span>
            <span class="text-xs text-white/70">Gestión de taller</span>
        </div>
        <button aria-label="Cerrar el menú" class="lg:hidden ml-auto w-9 h-9 rounded-full flex items-center justify-center text-white/80 hover:bg-white/10 transition-colors shrink-0" id="btn-cerrar-menu" type="button">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>
    <ul class="flex flex-col gap-1 overflow-y-auto flex-1 pb-6 no-scrollbar">
        {% for item in nav_items %}
        {% with icon=item.0 label=item.1 url_name=item.2 seccion=item.3 %}
        <li data-seccion="{{ seccion }}">
            {% if active == label %}
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#004f4f] text-white font-semibold text-sm shadow-inner" href="{% url url_name %}">
                <span class="material-symbols-outlined font-light" style="font-variation-settings: 'FILL' 0, 'wght' 300;">{{ icon }}</span>
                <span>{{ label }}</span>
            </a>
            {% else %}
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 hover:bg-white/10 hover:text-white transition-colors duration-200 text-sm" href="{% url url_name %}">
                <span class="material-symbols-outlined font-light" style="font-variation-settings: 'FILL' 0, 'wght' 300;">{{ icon }}</span>
                <span>{{ label }}</span>
            </a>
            {% endif %}
        </li>
        {% endwith %}
        {% endfor %}
    </ul>
    <div class="pt-4 border-t border-white/10">
        <form action="{% url 'kanview:logout' %}" method="post">
            {% csrf_token %}
            <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 hover:bg-white/10 transition-colors duration-200 text-sm text-left" type="submit">
                <span class="material-symbols-outlined font-light" style="font-variation-settings: 'FILL' 0, 'wght' 300;">logout</span>
                <span>Cerrar sesión</span>
            </button>
        </form>
    </div>
</aside>
<!-- Fondo oscuro del menú móvil: se muestra solo mientras el sidebar está abierto. -->
<div aria-hidden="true" class="hidden fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 lg:hidden" id="sidebar-fondo"></div>
