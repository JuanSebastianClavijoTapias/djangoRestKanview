{% extends "kanview/crud_base.html" %}
{% block title %}Kanview - {{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
<h2 class="text-2xl font-bold mb-2">{{ titulo }}</h2>
<p class="text-sm text-gray-500 mb-6">Pedido {{ pedido.codigo_pedido }} · {{ pedido.id_cliente.nombre }}</p>
<form class="bg-white rounded-2xl shadow-neomorphic-lift p-8 flex flex-col gap-4" method="post">
{% csrf_token %}
<label class="text-sm font-medium text-gray-700" for="id_descripcion">Cambio solicitado</label>
<textarea class="rounded-xl border px-4 py-3" id="id_descripcion" name="descripcion" rows="6" required>{% if solicitud %}{{ solicitud.descripcion }}{% endif %}</textarea>
<div class="flex gap-3 mt-2">
<button class="bg-[#006565] text-white px-6 py-2.5 rounded-xl text-sm font-semibold" type="submit">Guardar</button>
<a class="px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-100" href="{{ cancel_url }}">Cancelar</a>
</div>
</form>
</div>
{% endblock %}
